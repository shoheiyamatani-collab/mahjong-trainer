name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "35 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production and development dependencies
        run: pnpm security:audit
      - name: Check generated security headers
        run: pnpm test:security
      - name: Test data updater
        run: node --test scripts/update-mleague-stats.test.mjs
      - name: Test application and mahjong behavior
        run: pnpm exec vitest run
